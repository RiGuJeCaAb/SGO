name: Verificação

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar ferramentas de desenvolvimento
        run: npm ci

      # Os nove portões, pela ordem em que `npm run tudo` os corre e num só comando.
      # Correr aqui a lista escrita à mão foi o que deixou `tipos`, `morto`, `documentar`,
      # `manual` e `arrumado` cinco portões de fora sem ninguém dar por isso — e são
      # justamente os que guardam as regras próprias deste projeto. Acrescentar um portão
      # passa a ser uma linha no `package.json` e mais nada.
      - name: Verificação completa (npm run tudo)
        run: npm run tudo
