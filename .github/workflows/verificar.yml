name: Verificação

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar ferramentas de desenvolvimento
        run: npm ci

      - name: Sintaxe do script da aplicação
        run: npm run verificar

      - name: Testes
        run: npm run testar

      - name: Análise estática
        run: |
          npm run lint
          npm run lint-ferramentas
